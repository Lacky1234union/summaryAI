[project]
name = "summuraze"
version = "0.1.0"
description = "Саммаризатор лекций, семинаров, встреч и созвонов: локальный STT на CPU + LLM"
requires-python = ">=3.12,<3.15"

# Зависимости добавляются этапом, а не все сразу: на этом канале каждый лишний пакет —
# минуты ожидания, а неиспользуемая зависимость всё равно протухнет до своего этапа.
# Сейчас — то, что нужно этапам 0–2. Веб (#23) приедет со своей задачей.
dependencies = [
    # CLI
    "typer>=0.15",
    # Конфиг и контракты (#3, #4)
    "pydantic>=2.10",
    "pydantic-settings>=2.15",
    # Логи
    "loguru>=0.7",
    # STT: CTranslate2-рантайм, int8 на CPU (#11). Замерено в #1: колёса под 3.14 есть.
    # Он же даёт VAD (#10): Silero v6 в ONNX лежит в его составе, torch для этого не нужен
    # (ADR 2026-10-27). torch вернётся вместе с pyannote.audio на этапе 5.
    "faster-whisper>=1.2.1",
    # LLM (#15): OpenAI-совместимый протокол — один POST, SDK не нужен.
    "httpx>=0.28",
]

[project.scripts]
summuraze = "summuraze.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "mypy>=1.18",
    # Покрытие (#35): порог в [tool.coverage.report], гоняется `make cov` и в CI.
    "pytest-cov>=6.0",
]

# Сейчас torch в зависимостях нет (ADR 2026-10-27); индекс оставлен для этапа 5, когда его
# приведёт pyannote.audio.
# torch с PyPI по умолчанию тянет 29 пакетов, из них 15 — nvidia-* (CUDA 13): на машине без
# NVIDIA это гигабайты мёртвого груза. Индекс CPU даёт torch==2.14.0+cpu и 10 пакетов.
# Замерено 2026-09-23 (#1), подробности — docs/DECISIONS.md.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# Линтер и mypy целятся в 3.12, хотя разрабатываем на 3.14: так код остаётся совместим
# с фолбэком и не обрастает синтаксисом, из-за которого откат стал бы невозможен.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["summuraze"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: требует моделей или сети — не гоняется в обычном прогоне",
    "eval: метрики качества (WER, RTF), нужны фикстуры с reference-транскриптами",
]
addopts = "-m 'not slow and not eval'"

# Порог 85, а не текущие ~96: адаптеры ASR и LLM будут проверяться в основном slow-тестами
# с настоящими моделями, а их в быстром прогоне нет. Высокий порог тогда толкал бы к мокам,
# которые проверяют сами себя (#35, ADR в DECISIONS.md).
[tool.coverage.run]
source = ["summuraze"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summuraze"]
